<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Scouting Report</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">⚡ ScoutHub</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="athletes.html">Athletes</a></li>
        <li><a href="profile.html">Player Profile</a></li>
        <li><a href="report.html" class="active">Scouting Report</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="shortlist.html">Shortlist</a></li>
      </ul>
    </nav>
  </header>

  <main class="container" style="max-width: 800px;">
    <section class="feature-box">
      <h2>Log New Scouting Evaluation</h2>
      <p class="subtitle">Submitted evaluations are immediately attached to the selected athlete's profile.</p>

      <form id="scouting-report-form">
        <div class="filter-group">
          <label for="scout-name">Scout Name</label>
          <input type="search" id="scout-name" placeholder="Enter your full name" required>
        </div>

        <div class="filter-group">
          <label for="player-select">Select Athlete</label>
          <select id="player-select"></select>
        </div>

        <div class="filter-group">
          <label for="match-date">Assessment / Match Date</label>
          <input type="date" id="match-date" style="width: 100%; padding: 0.5rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #ffffff;">
        </div>

        <div class="filter-group">
          <label for="tech-score">Technical Rating (1 - 10): <strong id="tech-val">8.5</strong></label>
          <input type="range" id="tech-score" min="1" max="10" step="0.5" value="8.5" oninput="document.getElementById('tech-val').innerText = this.value">
        </div>

        <div class="filter-group">
          <label for="phys-score">Physical Rating (1 - 10): <strong id="phys-val">8.5</strong></label>
          <input type="range" id="phys-score" min="1" max="10" step="0.5" value="8.5" oninput="document.getElementById('phys-val').innerText = this.value">
        </div>

        <div class="filter-group">
          <label for="observations">Tactical Observations & Summary</label>
          <textarea id="observations" rows="5" required placeholder="Key strengths, tactical discipline, temperament under pressure..." style="width: 100%; padding: 0.6rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #ffffff;"></textarea>
        </div>

        <button type="submit" class="cta-btn full-width">Submit Scouting Dossier</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Project Assignment: Sports Talent Scouting Platform | Developed by Team &lt;!DOCTYPE Trio&gt;</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
