<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Scouting Report</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">⚡ ScoutHub</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="athletes.html">Athletes</a></li>
        <li><a href="profile.html">Player Profile</a></li>
        <li><a href="report.html" class="active">Scouting Report</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="shortlist.html">Shortlist</a></li>
      </ul>
    </nav>
  </header>

  <main class="container" style="max-width: 800px;">
    <section class="feature-box">
      <h2>Log New Scouting Evaluation</h2>
      <p class="subtitle">Complete this qualitative and quantitative assessment form for verified prospects.</p>

      <form>
        <div class="filter-group">
          <label for="scout-name">Scout Name</label>
          <input type="search" id="scout-name" placeholder="Enter your full name" required>
        </div>

        <div class="filter-group">
          <label for="player-select">Select Athlete</label>
          <select id="player-select">
            <option>Aarav Sharma (Football - Midfielder)</option>
            <option>Marcus Vance (Basketball - Point Guard)</option>
            <option>Rohan Deshmukh (Cricket - Fast Bowler)</option>
            <option>Vikram Negi (Football - Center Back)</option>
            <option>David Ortiz (Basketball - Small Forward)</option>
            <option>Simranjeet Kaur (Athletics - Sprinter)</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="match-date">Assessment / Match Date</label>
          <input type="date" id="match-date" style="width: 100%; padding: 0.5rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #ffffff;">
        </div>

        <div class="filter-group">
          <label for="tech-score">Technical Rating (1 - 10)</label>
          <input type="range" id="tech-score" min="1" max="10" step="0.5" value="8">
        </div>

        <div class="filter-group">
          <label for="phys-score">Physical Rating (1 - 10)</label>
          <input type="range" id="phys-score" min="1" max="10" step="0.5" value="8">
        </div>

        <div class="filter-group">
          <label for="observations">Tactical Observations & Summary</label>
          <textarea id="observations" rows="5" placeholder="Key strengths, tactical discipline, temperament under pressure..." style="width: 100%; padding: 0.6rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #ffffff;"></textarea>
        </div>

        <button type="button" class="cta-btn full-width" onclick="alert('Scouting Report logged successfully!')">Submit Scouting Dossier</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Project Assignment: Sports Talent Scouting Platform | Developed by Team &lt;!DOCTYPE Trio&gt;</p>
  </footer>

</body>
</html>
