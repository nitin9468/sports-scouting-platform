<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Directory - Sports Talent Scouting Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">⚡ ScoutHub</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="athletes.html" class="active">Athletes</a></li>
        <li><a href="profile.html">Player Profile</a></li>
        <li><a href="report.html">Scouting Report</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="shortlist.html">Shortlist</a></li>
      </ul>
    </nav>
  </header>

  <div class="container directory-layout">
    
    <!-- Filter + Add Athlete Sidebar -->
    <aside class="filter-panel">
      <h3>Filter Prospects</h3>
      <div class="filter-group">
        <label for="search">Search Name / Position</label>
        <input type="search" id="search" placeholder="e.g. Aarav or Guard...">
      </div>

      <div class="filter-group">
        <label for="sport">Select Sport</label>
        <select id="sport">
          <option value="all">All Sports</option>
          <option value="football">Football</option>
          <option value="basketball">Basketball</option>
          <option value="cricket">Cricket</option>
          <option value="athletics">Athletics</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="min-rating">Minimum Rating: <strong id="rating-label">5.0+</strong></label>
        <input type="range" id="min-rating" min="5" max="10" step="0.5" value="5">
      </div>

      <hr style="border-color: #334155; margin: 1.5rem 0;">

      <!-- Register New Athlete Form -->
      <h3>+ Register New Athlete</h3>
      <form id="add-athlete-form">
        <div class="filter-group">
          <label for="new-name">Full Name</label>
          <input type="search" id="new-name" placeholder="Player Name" required>
        </div>
        <div class="filter-group">
          <label for="new-sport">Sport</label>
          <select id="new-sport">
            <option value="Football">Football</option>
            <option value="Basketball">Basketball</option>
            <option value="Cricket">Cricket</option>
            <option value="Athletics">Athletics</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="new-pos">Position</label>
          <input type="search" id="new-pos" placeholder="e.g. Striker / Bowler" required>
        </div>
        <div class="filter-group">
          <label for="new-age">Age & Height</label>
          <div style="display:flex; gap:0.5rem;">
            <input type="number" id="new-age" value="18" min="14" max="30" required style="width:50%; padding:0.4rem; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:4px;">
            <input type="search" id="new-height" placeholder="5'11&quot;" style="width:50%;">
          </div>
        </div>
        <div class="filter-group">
          <label for="new-club">Academy / Club</label>
          <input type="search" id="new-club" placeholder="Academy Name">
        </div>
        <div class="filter-group">
          <label for="new-speed">Speed (1-100) & Skill (1-100)</label>
          <div style="display:flex; gap:0.5rem;">
            <input type="number" id="new-speed" value="85" min="40" max="100" required style="width:50%; padding:0.4rem; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:4px;">
            <input type="number" id="new-skill" value="88" min="40" max="100" required style="width:50%; padding:0.4rem; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:4px;">
          </div>
        </div>
        <div class="filter-group">
          <label for="new-rating">Overall Rating (1-10)</label>
          <input type="number" id="new-rating" value="8.5" step="0.1" min="1" max="10" required style="width:100%; padding:0.4rem; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:4px;">
        </div>
        <button type="submit" class="cta-btn full-width">Add Athlete</button>
      </form>
    </aside>

    <!-- Athlete Cards Directory -->
    <main class="directory-content">
      <div class="directory-header" style="margin-bottom: 1.2rem;">
        <h2 id="directory-count">Prospect Directory</h2>
      </div>
      <div class="card-grid" id="directory-grid"></div>
    </main>
  </div>

  <footer>
    <p>Project Assignment: Sports Talent Scouting Platform | Developed by Team &lt;!DOCTYPE Trio&gt;</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
